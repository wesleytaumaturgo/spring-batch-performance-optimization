version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: batchdb
    environment:
      POSTGRES_DB: batchdb
      POSTGRES_USER: batch
      POSTGRES_PASSWORD: batch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U batch -d batchdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: batch-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/batchdb
      DB_USER: batch
      DB_PASS: batch
      SPRING_PROFILES_ACTIVE: benchmark
    ports:
      - "8080:8080"

volumes:
  pgdata:
