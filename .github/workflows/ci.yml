name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: batchdb
          POSTGRES_USER: batch
          POSTGRES_PASSWORD: batch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        env:
          DB_URL: jdbc:postgresql://localhost:5432/batchdb
          DB_USER: batch
          DB_PASS: batch
        run: ./mvnw clean verify -B

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
